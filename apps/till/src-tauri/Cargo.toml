[package]
name = "till"
version = "0.1.0"
description = "Pharmacy till: local SQLite database and hardware access for the desktop app"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "till_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "bundled" compiles a recent SQLite in, so every till runs the same version
# (STRICT tables, FTS5 trigram search, ordered group_concat).
rusqlite = { version = "0.40", features = ["bundled"] }

# Windows print spooler (RAW receipts) and WebView2 settings (browser keys off, webview.rs).
# All three are already in the dependency tree via Tauri; the WebView2 pair is pinned to
# Tauri's own versions so there is never a second copy (check with `cargo tree -d`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_UI_Input_KeyboardAndMouse"] }
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
