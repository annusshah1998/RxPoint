name: Windows

# Windows build minutes cost more, so this runs on main, on tags, on pull requests that
# touch the desktop shell, or when started by hand (Actions → Windows → Run workflow).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'apps/till/src-tauri/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Rust checks and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/till/src-tauri
      - run: pnpm install --frozen-lockfile
      # The frontend must exist before the Rust crate compiles (tauri::generate_context!).
      - run: pnpm build
      - name: Clippy and tests (Windows-only code such as the print spooler)
        working-directory: apps/till/src-tauri
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: apps/till/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
